[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "kaito-guardrail-core"
version = "0.1.1"
description = "KAITO-owned guardrail scanners and streaming utilities"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = [
    "bc-detect-secrets==1.5.43",
    "json-repair==0.60.1",
    "regex==2024.11.6",
    "tiktoken==0.12.0",
]

[project.urls]
Homepage = "https://github.com/kaito-project/kaito-guardrail-core"
Source = "https://github.com/kaito-project/kaito-guardrail-core"
Issues = "https://github.com/kaito-project/kaito-guardrail-core/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["guardrail_core", "guardrail_core.*"]
exclude = ["*.tests", "*.tests.*"]
namespaces = false

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "UP", "SIM", "I"]
ignore = ["E501", "F821"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["guardrail_core"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
exclude = ["*.ipynb"]
