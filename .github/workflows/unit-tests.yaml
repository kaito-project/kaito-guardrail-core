name: Guardrail Core Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release-**]

permissions:
  contents: read

jobs:
  test-wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
          disable-sudo: true
          disable-telemetry: true

      - name: Check out code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build and test tools
        run: python -m pip install -r requirements-dev.txt

      - name: Lint and check formatting
        if: matrix.python-version == '3.12'
        run: |
          python -m ruff check --output-format=github .
          python -m ruff format --check .

      - name: Build and test distributions
        env:
          GUARDRAIL_CORE_DIST: ${{ runner.temp }}/guardrail-core-dist
        run: |
          python -m build --outdir "$GUARDRAIL_CORE_DIST"
          python -m twine check --strict "$GUARDRAIL_CORE_DIST/"*
          python -m pytest tests/test_distribution.py -q

      - name: Install and test outside source tree
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv guardrail-core-venv
          guardrail-core-venv/bin/python -m pip install pytest==9.1.1 ./guardrail-core-dist/*.whl
          mkdir -p guardrail-core-tests/secrets
          cp -R "$GITHUB_WORKSPACE/tests/streaming" guardrail-core-tests/streaming
          cp "$GITHUB_WORKSPACE/tests"/test_*.py guardrail-core-tests/
          rm guardrail-core-tests/test_distribution.py
          cp "$GITHUB_WORKSPACE/tests/secrets/test_scanner.py" guardrail-core-tests/secrets/
          guardrail-core-venv/bin/python -I -c 'import guardrail_core.streaming; print(guardrail_core.streaming.__file__)'
          guardrail-core-venv/bin/python -I -m pytest guardrail-core-tests -q
          guardrail-core-venv/bin/python -m pip check
